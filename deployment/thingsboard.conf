# ==============================================================================
# UNIQ Smart Home — JVM & Server Performance Tuning Configuration
# Place at: /etc/thingsboard/conf/thingsboard.conf on the Ubuntu/Debian server
# ==============================================================================

# Memory allocation (Adjust based on server RAM: for 4GB RAM use -Xms1024M -Xmx2048M)
export JAVA_OPTS="$JAVA_OPTS -Xms1024M -Xmx2048M"

# High-Performance Garbage Collector (G1GC for minimal latency and pauses)
export JAVA_OPTS="$JAVA_OPTS -XX:+UseG1GC"
export JAVA_OPTS="$JAVA_OPTS -XX:MaxGCPauseMillis=200"
export JAVA_OPTS="$JAVA_OPTS -XX:G1ReservePercent=15"
export JAVA_OPTS="$JAVA_OPTS -XX:InitiatingHeapOccupancyPercent=45"

# String deduplication to save memory
export JAVA_OPTS="$JAVA_OPTS -XX:+UseStringDeduplication"

# Optimize network and DNS resolution
export JAVA_OPTS="$JAVA_OPTS -Dnetworkaddress.cache.ttl=60"
export JAVA_OPTS="$JAVA_OPTS -Djava.net.preferIPv4Stack=true"
