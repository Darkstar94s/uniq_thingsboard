# ==============================================================================
# UNIQ Smart Home — High-Performance Nginx Reverse Proxy Configuration
# Provides sub-second initial load, 1-year browser caching, GZIP & WebSockets.
# ==============================================================================

upstream thingsboard_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _; # ضع دومين موقعك هنا مثل: app.uniqsmarthome.com

    # مسار ملفات الواجهة الساكنة المنتجة من البناء
    root /usr/share/thingsboard/bin/public;
    index index.html;

    # --------------------------------------------------------------------------
    # 1. GZIP Compression (تقليص حجم البيانات بنسبة 75-80%)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --------------------------------------------------------------------------
    # 2. Aggressive Browser Caching for Hashed Assets (فتح فوري في 0.2 ثانية)
    # ملفات Angular المشفرة بـ Hash تُخزن مؤقتاً في متصفح العميل لمدة سنة كاملة
    # --------------------------------------------------------------------------
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # صفحة index.html لا تُخزن لمنع تعليق التحديثات عند الترقية
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # 3. WebSocket Proxying (للبث المباشر لحالة الأجهزة والتنبيهات)
    # --------------------------------------------------------------------------
    location /api/ws {
        proxy_pass http://thingsboard_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # 4. REST API Reverse Proxy (تمرير طلبات البيانات لسيرفر ThingsBoard)
    # --------------------------------------------------------------------------
    location /api {
        proxy_pass http://thingsboard_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        client_max_body_size 50M;
    }

    # الودجات والصور والمحتوى الثابت عبر الـ API
    location /static {
        proxy_pass http://thingsboard_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # --------------------------------------------------------------------------
    # 5. Angular Single Page Application Routing
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
